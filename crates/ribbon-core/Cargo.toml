[package]
name = "ribbon-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Local, line-only protein ribbon geometry for native Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
